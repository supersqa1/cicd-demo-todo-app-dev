name: CI/CD demo

# During the lesson, every branch push shows the workflow immediately.
# Staging deploys only from main or the current rehearsal branch (see job condition).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install linter
        run: python -m pip install -r requirements-lint.txt
      - name: Block correctness errors
        run: ruff check app tests --select E9,F63,F7,F82 --output-format github
      - name: Report style findings (non-blocking)
        run: ruff check app tests --select E,W,I --ignore E9 --exit-zero --output-format concise

  unit_tests:
    name: Unit tests (simulated)
    runs-on: ubuntu-latest
    steps:
      - run: echo "SIMULATED - no real unit tests run in this lesson yet."

  integration_tests:
    name: Integration tests (simulated)
    runs-on: ubuntu-latest
    steps:
      - run: echo "SIMULATED - no real integration tests run in this lesson yet."

  package:
    name: Build and publish image
    needs: [lint, unit_tests, integration_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Name the image using the full commit SHA
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Enable ARM64 builds on the AMD64 runner
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show the published image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo "Tag: \`$IMAGE\`"
            echo "Deploy this exact artifact: \`$IMAGE_NAME@$DIGEST\`"
            echo "Platforms: linux/amd64 and linux/arm64"
            echo "Unit/integration tests are simulated; staging deployment follows."
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy staging
    needs: package
    # Keep quick rehearsal feedback without letting every branch deploy.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/pipeline-skeleton-and-regression'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pull and run the published image over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SERVER_HOST: ${{ vars.STAGING_HOST }}
          SERVER_USER: ${{ vars.STAGING_USER }}
          KNOWN_HOSTS: ${{ vars.STAGING_KNOWN_HOSTS }}
          IMAGE_REF: ${{ needs.package.outputs.image_ref }}
          DEPLOY_DIR: /root/projects/${{ github.event.repository.name }}
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: |
          : "${SSH_KEY:?Missing STAGING_SSH_KEY environment secret}"
          : "${SERVER_HOST:?Missing STAGING_HOST environment variable}"
          : "${SERVER_USER:?Missing STAGING_USER environment variable}"
          : "${KNOWN_HOSTS:?Missing verified STAGING_KNOWN_HOSTS environment variable}"
          : "${IMAGE_REF:?Missing published image reference}"

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset SSH_KEY
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15)
          target="$SERVER_USER@$SERVER_HOST"

          printf -v prepare_command 'mkdir -p %q' "$DEPLOY_DIR"
          ssh "${ssh_options[@]}" "$target" "$prepare_command"
          scp "${ssh_options[@]}" compose.deploy.yaml "$target:$DEPLOY_DIR/compose.deploy.yaml"
          printf -v deploy_command 'bash -s -- %q %q %q' "$DEPLOY_DIR" "$IMAGE_REF" "$PROJECT_NAME"
          ssh "${ssh_options[@]}" "$target" "$deploy_command" < scripts/deploy.sh

          curl --fail --silent --show-error --retry 5 --retry-connrefused \
            --connect-timeout 10 --max-time 20 "http://$SERVER_HOST:5151/" > /dev/null
          {
            echo "## Staging deployed"
            echo "Image: \`$IMAGE_REF\`"
            echo "URL: http://$SERVER_HOST:5151/"
            echo "Task files preserved in \`$DEPLOY_DIR/tasks\`."
          } >> "$GITHUB_STEP_SUMMARY"

  automation:
    name: Automation / Regression (placeholder)
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - run headless Playwright/pytest against staging and save reports."

  approval:
    name: Release approval (placeholder - no gate)
    needs: automation
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - configure a protected production environment. This is NOT an approval gate."

  production:
    name: Deploy production (placeholder)
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - deploy the SAME image tested in staging. No server is contacted."

  smoke:
    name: Production smoke check (placeholder)
    needs: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - verify production health. This smoke-check job is still a placeholder."
